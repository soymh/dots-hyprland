; Level meter for the Recorder popup (dots-hyprland-extensions).
; method=pipewire with no source follows the default input source, the same
; microphone rec-mic.sh records from.
[general]
mode = waves
framerate = 30
autosens = 1
bars = 32

[input]
method = pipewire

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
channels = mono
mono_option = average

[smoothing]
noise_reduction = 20
